<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 BLE 图片发送器</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f2f4f7;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    h1 {
        margin-top: 0;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 16px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    label {
        font-weight: bold;
    }

    input,
    select,
    button {
        font-size: 15px;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    input[type="number"] {
        width: 100px;
    }

    button {
        cursor: pointer;
        background: #eee;
    }

    button:hover {
        background: #ddd;
    }

    button.primary {
        background: #1677ff;
        color: white;
        border-color: #1677ff;
    }

    button.danger {
        background: #ff4d4f;
        color: white;
        border-color: #ff4d4f;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .status {
        padding: 10px;
        border-radius: 6px;
        background: #f6f6f6;
        font-family: monospace;
        white-space: pre-wrap;
    }

    .preview-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .preview-box {
        border: 1px solid #ccc;
        padding: 10px;
        background: #eee;
    }

    canvas {
        display: block;
        image-rendering: pixelated;
        border: 1px solid #999;
        max-width: 100%;
        height: auto;
    }

    .progress {
        width: 100%;
        height: 22px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
    }

    .progress-bar {
        width: 0%;
        height: 100%;
        background: #1677ff;
        transition: width 0.1s;
    }

    #log {
        height: 260px;
        overflow-y: auto;
        background: #111;
        color: #0f0;
        padding: 10px;
        font-family: Consolas, monospace;
        font-size: 13px;
        white-space: pre-wrap;
    }

    .value {
        font-family: monospace;
        color: #1677ff;
    }
</style>
</head>

<body>

<div class="container">

    <h1>ESP32 BLE 图片发送器</h1>

    <!-- BLE -->
    <div class="card">

        <h2>1. BLE连接</h2>

        <div class="row">
            <button class="primary" id="scanBtn">
                扫描 BLE
            </button>

            <button id="disconnectBtn" disabled>
                断开
            </button>
        </div>

        <div class="status">
设备：
<span id="deviceName">未连接</span>

连接状态：
<span id="bleStatus">未连接</span>

Service：
<span id="serviceInfo">---</span>

RX：
<span id="rxInfo">---</span>

Indicate：
<span id="indicateInfo">---</span>
        </div>

    </div>


    <!-- 图片 -->
    <div class="card">

        <h2>2. 图片</h2>

        <div class="row">

            <label>
                图片：
            </label>

            <input
                type="file"
                id="imageFile"
                accept="image/*"
            >

        </div>


        <div class="row">

            <label>
                宽度：
            </label>

            <input
                type="number"
                id="imageWidth"
                value="250"
                min="1"
                max="2000"
            >

            <label>
                高度：
            </label>

            <input
                type="number"
                id="imageHeight"
                value="122"
                min="1"
                max="2000"
            >

            <button id="useOriginalSizeBtn">
                使用原图尺寸
            </button>

        </div>


        <div class="row">

            <label>
                位深：
            </label>

            <select id="bitDepth">

                <option value="1">
                    1 bit 黑白
                </option>

                <option value="2">
                    2 bit 灰度
                </option>

                <option value="4">
                    4 bit 灰度
                </option>

                <option value="8">
                    8 bit 灰度
                </option>

            </select>

        </div>


        <div class="row">

            <label>
                取模方向：
            </label>

            <select id="scanMode">

                <option value="row">
                    横向逐行
                </option>

                <option value="column">
                    纵向逐列
                </option>

            </select>

        </div>


        <div class="preview-container">

            <div class="preview-box">

                <div>
                    原图
                </div>

                <canvas id="originalCanvas"></canvas>

            </div>


            <div class="preview-box">

                <div>
                    取模后预览
                </div>

                <canvas id="previewCanvas"></canvas>

            </div>

        </div>

    </div>


    <!-- 数据 -->
    <div class="card">

        <h2>3. 数据参数</h2>

        <div class="row">

            <span>
                图片尺寸：
                <span
                    class="value"
                    id="sizeInfo"
                >
                    ---
                </span>
            </span>

        </div>


        <div class="row">

            <span>
                取模数据：
                <span
                    class="value"
                    id="dataSizeInfo"
                >
                    ---
                </span>
            </span>

        </div>


        <div class="row">

            <span>
                分包大小：
                <span
                    class="value"
                    id="packetSizeInfo"
                >
                    ---
                </span>
            </span>

        </div>


        <div class="row">

            <span>
                总包数：
                <span
                    class="value"
                    id="packetCountInfo"
                >
                    ---
                </span>
            </span>

        </div>

    </div>


    <!-- 发送 -->
    <div class="card">

        <h2>4. 发送图片</h2>

        <div class="row">

            <button
                class="primary"
                id="sendBtn"
                disabled
            >
                开始发送
            </button>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <div
            style="margin-top:10px"
            id="progressText"
        >
            0%
        </div>

    </div>


    <!-- 日志 -->
    <div class="card">

        <h2>5. 日志</h2>

        <div id="log"></div>

    </div>

</div>


<script>

/* =========================================================
 * BLE UUID
 * ========================================================= */

const BLE_DEVICE_NAME = "EspBle";

const SERVICE_UUID = 0xEEE0;

const RX_UUID = 0xEEE1;

const TX_UUID = 0xEEE2;

const INDICATE_UUID = 0xEEE3;

const NOTIFY_UUID = 0xEEE4;


/* =========================================================
 * BLE对象
 * ========================================================= */

let bleDevice = null;

let bleServer = null;

let bleService = null;

let rxCharacteristic = null;

let txCharacteristic = null;

let indicateCharacteristic = null;

let notifyCharacteristic = null;


/*
 * ESP32代码目前默认兼容 MTU 128。
 *
 * BLE ATT MTU = 128
 *
 * 实际一次 Write 最大：
 *
 *     MTU - 3
 *     = 125 bytes
 *
 * 你的图片协议还有4字节包头：
 *
 *     index  2 bytes
 *     size   2 bytes
 *
 * 所以图片数据：
 *
 *     125 - 4 = 121
 *
 * 这里保守使用120。
 */

const BLE_DATA_SIZE = 120;


/* =========================================================
 * 状态
 * ========================================================= */

let originalImage = null;

let convertedData = null;

let packetSize = BLE_DATA_SIZE;

let packetTotal = 0;


/*
 * ACK等待
 */

let ackWaiter = null;


/* =========================================================
 * 日志
 * ========================================================= */

function log(message) {

    const logElement =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;
}


/* =========================================================
 * BLE扫描
 * ========================================================= */

document
.getElementById("scanBtn")
.addEventListener("click", scanBLE);


async function scanBLE() {

    try {

        log("开始扫描 BLE...");

        /*
         * 使用 service UUID 过滤。
         *
         * Chrome / Edge Web Bluetooth
         * 要求网页使用 HTTPS 或 localhost。
         */

        bleDevice =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name: BLE_DEVICE_NAME
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        log(
            "找到设备：" +
            (bleDevice.name || "Unknown")
        );


        bleDevice.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        await connectBLE();

    }
    catch(error) {

        console.error(error);

        log(
            "扫描/连接失败：" +
            error.message
        );

    }

}


/* =========================================================
 * BLE连接
 * ========================================================= */

async function connectBLE() {

    try {

        log("正在连接...");

        bleServer =
            await bleDevice.gatt.connect();


        log("GATT连接成功");


        bleService =
            await bleServer.getPrimaryService(
                SERVICE_UUID
            );


        log(
            "找到 Service: 0xEEE0"
        );


        /*
         * 获取 RX
         */

        rxCharacteristic =
            await bleService.getCharacteristic(
                RX_UUID
            );


        /*
         * 获取 TX
         */

        try {

            txCharacteristic =
                await bleService.getCharacteristic(
                    TX_UUID
                );

        }
        catch(error) {

            txCharacteristic = null;

        }


        /*
         * 获取 Indicate
         */

        try {

            indicateCharacteristic =
                await bleService.getCharacteristic(
                    INDICATE_UUID
                );


            await indicateCharacteristic
                .startNotifications();


            indicateCharacteristic
                .addEventListener(
                    "characteristicvaluechanged",
                    handleIndicate
                );


            log(
                "EEE3 Indicate 已开启"
            );

        }
        catch(error) {

            log(
                "EEE3 Indicate 获取失败：" +
                error.message
            );

        }


        /*
         * 获取 Notify
         */

        try {

            notifyCharacteristic =
                await bleService.getCharacteristic(
                    NOTIFY_UUID
                );

        }
        catch(error) {

            notifyCharacteristic = null;

        }


        document
            .getElementById("deviceName")
            .textContent =
            bleDevice.name || BLE_DEVICE_NAME;


        document
            .getElementById("bleStatus")
            .textContent =
            "已连接";


        document
            .getElementById("serviceInfo")
            .textContent =
            "0xEEE0";


        document
            .getElementById("rxInfo")
            .textContent =
            "0xEEE1";


        document
            .getElementById("indicateInfo")
            .textContent =
            indicateCharacteristic
                ? "0xEEE3 已订阅"
                : "不可用";


        document
            .getElementById("disconnectBtn")
            .disabled = false;


        updateSendButton();


        log("BLE连接完成");

    }
    catch(error) {

        console.error(error);

        log(
            "连接失败：" +
            error.message
        );

    }

}


/* =========================================================
 * 断开
 * ========================================================= */

document
.getElementById("disconnectBtn")
.addEventListener(
    "click",
    disconnectBLE
);


function disconnectBLE() {

    if (
        bleDevice &&
        bleDevice.gatt.connected
    ) {

        bleDevice.gatt.disconnect();

    }

}


function onDisconnected() {

    log("BLE已断开");

    document
        .getElementById("bleStatus")
        .textContent =
        "未连接";


    document
        .getElementById("disconnectBtn")
        .disabled = true;


    updateSendButton();

}


/* =========================================================
 * 接收 Indicate
 * ========================================================= */

function handleIndicate(event) {

    const value =
        event.target.value;


    const bytes =
        new Uint8Array(
            value.buffer,
            value.byteOffset,
            value.byteLength
        );


    const text =
        new TextDecoder()
            .decode(bytes);


    log(
        "ESP32 -> " +
        text
    );


    /*
     * ACK格式：
     *
     * ACK+0
     * ACK+1
     * ACK+2
     * ...
     */

    if (
        ackWaiter &&
        text.startsWith("ACK+")
    ) {

        const match =
            text.match(
                /ACK\+(\d+)/
            );


        if (match) {

            const ackNumber =
                parseInt(
                    match[1]
                );


            const resolve =
                ackWaiter;


            ackWaiter = null;


            resolve(
                ackNumber
            );

        }

    }

}


/* =========================================================
 * 等待ACK
 * ========================================================= */

function waitForAck(timeout = 3000) {

    return new Promise(
        (resolve, reject) => {

            const timer =
                setTimeout(
                    () => {

                        if (
                            ackWaiter
                        ) {

                            ackWaiter = null;

                            reject(
                                new Error(
                                    "等待 ACK 超时"
                                )
                            );

                        }

                    },
                    timeout
                );


            ackWaiter =
                (ackNumber) => {

                    clearTimeout(timer);

                    resolve(
                        ackNumber
                    );

                };

        }
    );

}


/* =========================================================
 * 发送字符串
 * ========================================================= */

async function writeString(text) {

    if (!rxCharacteristic) {

        throw new Error(
            "RX Characteristic不存在"
        );

    }


    const data =
        new TextEncoder()
            .encode(text);


    log(
        "网页 -> ESP32: " +
        text
    );


    /*
     * writeValueWithoutResponse
     *
     * 对应：
     *
     * BLE_GATT_CHR_F_WRITE_NO_RSP
     */

    await rxCharacteristic
        .writeValueWithoutResponse(data);

}


/* =========================================================
 * 图片选择
 * ========================================================= */

document
.getElementById("imageFile")
.addEventListener(
    "change",
    handleImageFile
);


async function handleImageFile(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    log(
        "选择图片：" +
        file.name
    );


    const image =
        new Image();


    image.src =
        URL.createObjectURL(file);


    await new Promise(
        (resolve, reject) => {

            image.onload = resolve;

            image.onerror = reject;

        }
    );


    originalImage = image;


    /*
     * 显示原图尺寸
     */

    document
        .getElementById("imageWidth")
        .value =
        image.naturalWidth;


    document
        .getElementById("imageHeight")
        .value =
        image.naturalHeight;


    drawOriginalImage();


    convertImage();

}


/* =========================================================
 * 使用原图尺寸
 * ========================================================= */

document
.getElementById("useOriginalSizeBtn")
.addEventListener(
    "click",
    () => {

        if (!originalImage) {

            return;

        }


        document
            .getElementById("imageWidth")
            .value =
            originalImage.naturalWidth;


        document
            .getElementById("imageHeight")
            .value =
            originalImage.naturalHeight;


        convertImage();

    }
);


/* =========================================================
 * 参数改变
 * ========================================================= */

document
.getElementById("imageWidth")
.addEventListener(
    "change",
    convertImage
);


document
.getElementById("imageHeight")
.addEventListener(
    "change",
    convertImage
);


document
.getElementById("bitDepth")
.addEventListener(
    "change",
    convertImage
);


document
.getElementById("scanMode")
.addEventListener(
    "change",
    convertImage
);


/* =========================================================
 * 绘制原图
 * ========================================================= */

function drawOriginalImage() {

    if (!originalImage) {

        return;

    }


    const canvas =
        document.getElementById(
            "originalCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        originalImage.naturalWidth;


    canvas.height =
        originalImage.naturalHeight;


    ctx.drawImage(
        originalImage,
        0,
        0
    );

}


/* =========================================================
 * 图片取模
 * ========================================================= */

function convertImage() {

    if (!originalImage) {

        return;

    }


    const width =
        parseInt(
            document.getElementById(
                "imageWidth"
            ).value
        );


    const height =
        parseInt(
            document.getElementById(
                "imageHeight"
            ).value
        );


    const bitDepth =
        parseInt(
            document.getElementById(
                "bitDepth"
            ).value
        );


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    /*
     * 建立临时Canvas
     */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext("2d");


    /*
     * 将图片缩放到指定尺寸
     */

    ctx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    /*
     * 根据位深取模
     */

    convertedData =
        imageToBitmap(
            imageData,
            width,
            height,
            bitDepth
        );


    /*
     * 更新预览
     */

    drawConvertedPreview(
        imageData,
        width,
        height,
        bitDepth
    );


    /*
     * 更新信息
     */

    document
        .getElementById("sizeInfo")
        .textContent =
        `${width} × ${height}`;


    document
        .getElementById("dataSizeInfo")
        .textContent =
        `${convertedData.length} Bytes`;


    packetTotal =
        Math.ceil(
            convertedData.length /
            packetSize
        );


    document
        .getElementById("packetSizeInfo")
        .textContent =
        `${packetSize} Bytes data`;


    document
        .getElementById("packetCountInfo")
        .textContent =
        packetTotal;


    updateSendButton();

}


/* =========================================================
 * RGB -> 灰度
 * ========================================================= */

function rgbToGray(
    r,
    g,
    b
) {

    /*
     * 常用灰度公式
     */

    return Math.round(
        0.299 * r +
        0.587 * g +
        0.114 * b
    );

}


/* =========================================================
 * 图片取模
 *
 * 1bit:
 *
 * 黑 = 1
 * 白 = 0
 *
 * bit7 -> bit0
 * ========================================================= */

function imageToBitmap(
    imageData,
    width,
    height,
    bitDepth
) {

    const pixels =
        imageData.data;


    /*
     * 1bit
     */

    if (bitDepth === 1) {

        const bytesPerRow =
            Math.ceil(
                width / 8
            );


        const result =
            new Uint8Array(
                bytesPerRow *
                height
            );


        for (
            let y = 0;
            y < height;
            y++
        ) {

            for (
                let x = 0;
                x < width;
                x++
            ) {

                const pos =
                    (
                        y * width +
                        x
                    ) * 4;


                const gray =
                    rgbToGray(
                        pixels[pos],
                        pixels[pos + 1],
                        pixels[pos + 2]
                    );


                /*
                 * 黑色为1
                 *
                 * 阈值128
                 */

                const black =
                    gray < 128;


                if (black) {

                    const byteIndex =
                        y *
                        bytesPerRow +
                        Math.floor(
                            x / 8
                        );


                    const bitIndex =
                        7 -
                        (x % 8);


                    result[byteIndex] |=
                        (1 << bitIndex);

                }

            }

        }


        return result;

    }


    /*
     * 2bit
     *
     * 每像素2bit
     *
     * 4像素/byte
     */

    if (bitDepth === 2) {

        const pixelsPerByte = 4;


        const totalBytes =
            Math.ceil(
                width *
                height /
                pixelsPerByte
            );


        const result =
            new Uint8Array(
                totalBytes
            );


        for (
            let i = 0;
            i < width * height;
            i++
        ) {

            const pos =
                i * 4;


            const gray =
                rgbToGray(
                    pixels[pos],
                    pixels[pos + 1],
                    pixels[pos + 2]
                );


            /*
             * 0~255
             *
             * 映射到0~3
             */

            const value =
                Math.round(
                    gray * 3 / 255
                );


            const byteIndex =
                Math.floor(
                    i / 4
                );


            const shift =
                6 -
                (i % 4) * 2;


            result[byteIndex] |=
                value << shift;

        }


        return result;

    }


    /*
     * 4bit
     *
     * 2像素/byte
     */

    if (bitDepth === 4) {

        const totalBytes =
            Math.ceil(
                width *
                height /
                2
            );


        const result =
            new Uint8Array(
                totalBytes
            );


        for (
            let i = 0;
            i < width * height;
            i++
        ) {

            const pos =
                i * 4;


            const gray =
                rgbToGray(
                    pixels[pos],
                    pixels[pos + 1],
                    pixels[pos + 2]
                );


            const value =
                Math.round(
                    gray * 15 / 255
                );


            const byteIndex =
                Math.floor(
                    i / 2
                );


            if (
                (i & 1) === 0
            ) {

                result[byteIndex] |=
                    value << 4;

            }
            else {

                result[byteIndex] |=
                    value;

            }

        }


        return result;

    }


    /*
     * 8bit
     */

    if (bitDepth === 8) {

        const result =
            new Uint8Array(
                width * height
            );


        for (
            let i = 0;
            i < width * height;
            i++
        ) {

            const pos =
                i * 4;


            result[i] =
                rgbToGray(
                    pixels[pos],
                    pixels[pos + 1],
                    pixels[pos + 2]
                );

        }


        return result;

    }


    return new Uint8Array();

}


/* =========================================================
 * 取模预览
 * ========================================================= */

function drawConvertedPreview(
    imageData,
    width,
    height,
    bitDepth
) {

    const canvas =
        document.getElementById(
            "previewCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        width;


    canvas.height =
        height;


    /*
     * 先显示原图
     */

    ctx.putImageData(
        imageData,
        0,
        0
    );


    /*
     * 1bit时显示真正的黑白效果
     */

    if (bitDepth === 1) {

        const output =
            ctx.getImageData(
                0,
                0,
                width,
                height
            );


        for (
            let i = 0;
            i < width * height;
            i++
        ) {

            const p =
                i * 4;


            const gray =
                rgbToGray(
                    output.data[p],
                    output.data[p + 1],
                    output.data[p + 2]
                );


            const value =
                gray < 128
                    ? 0
                    : 255;


            output.data[p] =
                value;

            output.data[p + 1] =
                value;

            output.data[p + 2] =
                value;

            output.data[p + 3] =
                255;

        }


        ctx.putImageData(
            output,
            0,
            0
        );

    }

}


/* =========================================================
 * 更新发送按钮
 * ========================================================= */

function updateSendButton() {

    const button =
        document.getElementById(
            "sendBtn"
        );


    button.disabled =
        !(
            bleDevice &&
            bleDevice.gatt &&
            bleDevice.gatt.connected &&
            rxCharacteristic &&
            indicateCharacteristic &&
            convertedData
        );

}


/* =========================================================
 * 发送图片
 * ========================================================= */

document
.getElementById("sendBtn")
.addEventListener(
    "click",
    sendImage
);


async function sendImage() {

    if (!convertedData) {

        alert("请先选择图片");

        return;

    }


    if (
        !rxCharacteristic ||
        !indicateCharacteristic
    ) {

        alert(
            "BLE RX 或 Indicate 不可用"
        );

        return;

    }


    const width =
        parseInt(
            document.getElementById(
                "imageWidth"
            ).value
        );


    const height =
        parseInt(
            document.getElementById(
                "imageHeight"
            ).value
        );


    const bitDepth =
        parseInt(
            document.getElementById(
                "bitDepth"
            ).value
        );


    try {

        document
            .getElementById("sendBtn")
            .disabled = true;


        setProgress(
            0,
            "准备发送..."
        );


        /*
         * =================================================
         * 第一步
         *
         * UPDATE_IMAGE
         * =================================================
         */

        await writeString(
            "UPDATE_IMAGE"
        );


        /*
         * 等待 ESP32 进入图片模式。
         *
         * 你的代码这里设置：
         *
         * epaper_st.mode=UPDATE_IMAGE
         *
         * 但是这里的 ACK+0 是在下一次
         * PICINFO 处理后产生。
         */


        await sleep(100);


        /*
         * =================================================
         * 第二步
         *
         * PICINFO
         * =================================================
         *
         * 格式：
         *
         * PICINFO
         * width:xxx
         * heigh:xxx
         * order:0
         * size:xxx
         * Total:xxx
         */

        /*
         * 关键：
         *
         * ESP32使用：
         *
         * image_total_size
         * pack_total
         *
         * 来malloc和接收。
         *
         * 所以这里使用实际发送的数据长度。
         */

        packetTotal =
            Math.ceil(
                convertedData.length /
                packetSize
            );


        const totalSize =
            packetTotal *
            packetSize;


        /*
         * 为了匹配ESP32：
         *
         * 每个包必须一样大。
         *
         * 所以最后补0。
         */

        const paddedData =
            new Uint8Array(
                totalSize
            );


        paddedData.set(
            convertedData
        );


        /*
         * order暂时固定为0
         */

        const picInfo =
            `PICINFO ` +
            `width:${width} ` +
            `heigh:${height} ` +
            `order:0 ` +
            `size:${totalSize} ` +
            `Total:${packetTotal}`;


        log(
            "发送图片信息：" +
            picInfo
        );


        await writeString(
            picInfo
        );


        /*
         * =================================================
         * 等待 ACK+0
         * =================================================
         */

        setProgress(
            0,
            "等待 ESP32 ACK+0..."
        );


        const infoAck =
            await waitForAck(5000);


        log(
            "收到图片信息ACK：" +
            infoAck
        );


        if (infoAck !== 0) {

            throw new Error(
                "图片信息ACK错误：" +
                infoAck
            );

        }


        /*
         * =================================================
         * 第三步
         *
         * 发送图片数据
         * =================================================
         */

        for (
            let index = 0;
            index < packetTotal;
            index++
        ) {

            const start =
                index *
                packetSize;


            const end =
                start +
                packetSize;


            const packetData =
                paddedData.slice(
                    start,
                    end
                );


            /*
             * 数据包：
             *
             * +----------------+
             * | index  2 bytes |
             * +----------------+
             * | size   2 bytes |
             * +----------------+
             * | data           |
             * +----------------+
             */


            const packet =
                new Uint8Array(
                    4 +
                    packetData.length
                );


            /*
             * pack_index
             *
             * 小端
             */

            packet[0] =
                index & 0xff;


            packet[1] =
                (index >> 8) & 0xff;


            /*
             * pack_size
             */

            packet[2] =
                packetSize & 0xff;


            packet[3] =
                (packetSize >> 8) & 0xff;


            /*
             * 图片数据
             */

            packet.set(
                packetData,
                4
            );


            /*
             * 发送数据
             */

            log(
                `发送 ${index + 1}/${packetTotal}`
            );


            await rxCharacteristic
                .writeValueWithoutResponse(
                    packet
                );


            /*
             * ESP32：
             *
             * sprintf(
             *     epaper_st.indicate,
             *     "ACK+%d",
             *     epaper_st.pack_index+1
             * );
             *
             * 所以：
             *
             * index=0
             * ACK+1
             *
             * index=1
             * ACK+2
             *
             */

            const ack =
                await waitForAck(
                    5000
                );


            const expected =
                index + 1;


            if (ack !== expected) {

                throw new Error(
                    `ACK错误：收到 ACK+${ack}，期望 ACK+${expected}`
                );

            }


            const percent =
                Math.round(
                    (
                        (index + 1) /
                        packetTotal
                    ) * 100
                );


            setProgress(
                percent,
                `发送中 ${index + 1}/${packetTotal}`
            );


            /*
             * 稍微让出浏览器事件循环。
             */

            await sleep(5);

        }


        /*
         * =================================================
         * 完成
         * =================================================
         */

        setProgress(
            100,
            "图片发送完成"
        );


        log(
            "图片全部发送完成"
        );


        /*
         * ESP32收到最后一个包以后：
         *
         * epaper_st.step=DONE
         *
         * epaper_st.indicate="Rec_Full"
         *
         */


        /*
         * 等一下，让ESP32发送Rec_Full
         */

        await sleep(300);


        /*
         * 退出图片接收状态
         */

        await writeString(
            "EXIT"
        );


        log(
            "发送 EXIT"
        );


    }
    catch(error) {

        console.error(error);

        log(
            "发送失败：" +
            error.message
        );


        setProgress(
            0,
            "发送失败"
        );

    }
    finally {

        updateSendButton();

    }

}


/* =========================================================
 * 进度条
 * ========================================================= */

function setProgress(
    percent,
    text
) {

    document
        .getElementById("progressBar")
        .style.width =
        percent + "%";


    document
        .getElementById("progressText")
        .textContent =
        text;

}


/* =========================================================
 * sleep
 * ========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
