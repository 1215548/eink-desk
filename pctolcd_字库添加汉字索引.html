<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点阵字模格式转换工具 · 编码修正版</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1f2937}
  .wrap{max-width:1460px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.5px}
  .sub{font-size:13px;color:#64748b;margin:0 0 18px}
  .panel{display:grid;grid-template-columns:1fr 260px 1fr;gap:16px;align-items:stretch}
  @media (max-width:960px){.panel{grid-template-columns:1fr}}
  .box{display:flex;flex-direction:column;background:#fff;border:1px solid #dbe3ec;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .box > header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;font-size:13px;font-weight:600;color:#334155;background:#f8fafc;border-bottom:1px solid #e6ecf3}
  .box > header .tag{font-weight:400;font-size:12px;color:#94a3b8}
  textarea{flex:1;width:100%;min-height:430px;border:0;outline:none;resize:vertical;padding:12px 14px;font-size:13px;line-height:1.55;font-family:Consolas,Monaco,"Courier New",monospace;color:#0f172a;background:#fff;white-space:pre;tab-size:4}
  .controls{display:flex;flex-direction:column;gap:11px;background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .controls label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#475569;font-weight:600}
  .controls input,.controls select{height:34px;padding:0 10px;border:1px solid #d3dce6;border-radius:8px;font-size:13px;outline:none;background:#fbfdff;color:#0f172a;font-family:inherit}
  .controls input:focus,.controls select:focus{border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.15)}
  .hint{font-weight:400;color:#9aa8b8;font-size:11px}
  button{height:38px;border:0;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.15s}
  #btnConvert{background:#2563eb;color:#fff;margin-top:4px}
  #btnConvert:hover{background:#1d4ed8}
  button.ghost{background:#fff;color:#334155;border:1px solid #d3dce6}
  button.ghost:hover{background:#f1f5f9}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .status{margin-top:auto;font-size:12px;line-height:1.6;color:#64748b;min-height:34px}
  .status.ok{color:#15803d}
  .status.err{color:#dc2626}
  .preview-wrap{margin-top:22px}
  .preview-wrap h2{font-size:15px;margin:0 0 12px;color:#334155;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .preview-wrap h2 .opts{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:400;color:#475569}
  .preview-wrap h2 .opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
  #preview{display:flex;flex-wrap:wrap;gap:14px;background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:16px;min-height:60px}
  #preview .item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid #e8eef6}
  #preview .item canvas{display:block;image-rendering:pixelated;border-radius:3px;background:#fff;box-shadow:0 0 0 1px #e2e8f0}
  #preview .item .ch{font-size:15px;color:#1e293b;line-height:1}
  #preview .item .dim{font-size:10.5px;color:#94a3b8;font-family:Consolas,monospace}
  #preview .item .dim.warn{color:#dc2626}
  .file-row{display:flex;gap:8px}
  .file-row button{flex:1}
  .enc-tip{font-size:11px;line-height:1.5;color:#94a3b8;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <h1>点阵字模格式转换工具</h1>
  <p class="sub">把 <code>{0x..,0x.., /*"字",n*/}</code> 形式的字模数组，转换成带注释的 C 字库结构。已修复 GBK / UTF-8 编码读取问题。</p>

  <div class="panel">
    <div class="box">
      <header><span>输入 · 原始字模</span><span class="tag">粘贴或导入文件</span></header>
      <textarea id="input" spellcheck="false" placeholder='在此粘贴原始内容……'></textarea>
    </div>

    <div class="controls">
      <label>字体名称<input id="fontName" value="微软雅黑"></label>
      <label>字号<input id="fontSize" value="12"></label>
      <div class="row2">
        <label>字宽<input id="width" type="number" value="16" min="1"></label>
        <label>字高 <span class="hint">留空自动</span><input id="height" type="number" placeholder="自动" min="1"></label>
      </div>
      <label>字节内位序
        <select id="bitOrder">
          <option value="msb" selected>高位在左（MSB First）</option>
          <option value="lsb">低位在左（LSB First）</option>
        </select>
      </label>
      <label>文件编码 <span class="enc-tip">打开文件时使用，中文乱码请切换</span>
        <select id="encoding">
          <option value="auto" selected>自动检测（推荐）</option>
          <option value="utf-8">UTF-8</option>
          <option value="gbk">GBK / GB2312</option>
          <option value="gb18030">GB18030</option>
          <option value="big5">Big5（繁体）</option>
        </select>
      </label>
      <button id="btnConvert">转 换 →</button>
      <button id="btnCopy" class="ghost">复制结果</button>
      <div class="file-row">
        <button id="btnOpen" class="ghost">打开文件</button>
        <button id="btnSample" class="ghost">示例</button>
      </div>
      <input type="file" id="fileInput" accept=".txt,.h,.c,.inc,.dat,text/*" hidden>
      <div class="status" id="status">等待转换…</div>
    </div>

    <div class="box">
      <header><span>输出 · C 字库格式</span><span class="tag" id="outTag">—</span></header>
      <textarea id="output" spellcheck="false" placeholder="转换结果会显示在这里…"></textarea>
    </div>
  </div>

  <div class="preview-wrap">
    <h2>
      点阵预览
      <span class="opts">
        <label><input type="checkbox" id="chkGrid" checked> 显示网格</label>
        <label>缩放
          <select id="zoom">
            <option value="4">4x</option>
            <option value="6">6x</option>
            <option value="8" selected>8x</option>
            <option value="10">10x</option>
            <option value="14">14x</option>
          </select>
        </label>
      </span>
    </h2>
    <div id="preview"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  const SAMPLE = `{
0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xFF,0xFE,
0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,/*"一",0*/

0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0x03,0xF8,0x02,0x00,
0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0x02,0x00,0xFF,0xFE,0x00,0x00,/*"上",1*/

0x1F,0xF0,0x10,0x10,0x10,0x10,0x1F,0xF0,0x10,0x10,0x10,0x10,0x1F,0xF0,0x00,0x00,
0xFF,0xFE,0x01,0x00,0x11,0x00,0x11,0xF8,0x11,0x00,0x29,0x00,0x45,0x00,0x83,0xFE,/*"是",2*/

0x1F,0xF0,0x10,0x10,0x10,0x10,0x1F,0xF0,0x10,0x10,0x10,0x10,0x1F,0xF0,0x00,0x00,
0xFF,0xFE,0x01,0x00,0x11,0x00,0x11,0xF8,0x11,0x00,0x29,0x00,0x45,0x00,0x83,0xFE,/*"是",3*/

}`;

  /* ================= 解析 ================= */

  const COMMENT_RE = /\/\*\s*"([^"]*)"\s*(?:,\s*(\d+))?\s*\*\//g;
  const BYTE_RE = /0x([0-9A-Fa-f]{1,2})(?![0-9A-Fa-f])/g;

  function parseInput(src) {
    const items = [];
    let m, last = 0;
    COMMENT_RE.lastIndex = 0;
    while ((m = COMMENT_RE.exec(src)) !== null) {
      const chunk = src.slice(last, m.index);
      last = COMMENT_RE.lastIndex;

      const bytes = [];
      let b;
      BYTE_RE.lastIndex = 0;
      while ((b = BYTE_RE.exec(chunk)) !== null) bytes.push(parseInt(b[1], 16));
      if (!bytes.length) continue;

      items.push({ ch: m[1] || "?", bytes: bytes, index: m[2] });
    }
    return items;
  }

  /* ================= 格式化 ================= */

  const BYTES_PER_LINE = 16;
  const toHex = (v) => "0x" + v.toString(16).toUpperCase().padStart(2, "0");
  const escChar = (ch) => ch.replace(/\\/g, "\\\\").replace(/"/g, '\\"');

  function buildBlock(item, width, height, fontName, fontSize) {
    const lines = [];
    for (let i = 0; i < item.bytes.length; i += BYTES_PER_LINE) {
      lines.push(item.bytes.slice(i, i + BYTES_PER_LINE).map(toHex).join(","));
    }
    const body = lines.map((l, i) => (i === lines.length - 1 ? l : l + ",")).join("\n");

    return (
      "/*--  文字:  " + item.ch + "  --*/\n" +
      "/*--  " + fontName + fontSize + ";  此字体下对应的点阵为：宽x高=" +
      width + "x" + height + "   --*/\n" +
      '{"' + escChar(item.ch) + '", {\n' +
      body + "}}"
    );
  }

  /* ================= 预览渲染 ================= */

  function drawGlyph(canvas, bytes, w, h, scale, msbFirst, showGrid) {
    const dpr = window.devicePixelRatio || 1;
    const px = Math.max(1, Math.round(scale * dpr));

    canvas.width = w * px;
    canvas.height = h * px;
    canvas.style.width = (w * scale) + "px";
    canvas.style.height = (h * scale) + "px";

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const bpr = Math.ceil(w / 8);

    ctx.fillStyle = "#0f172a";
    for (let row = 0; row < h; row++) {
      const baseY = row * px;
      for (let col = 0; col < w; col++) {
        const byteIdx = row * bpr + (col >> 3);
        if (byteIdx >= bytes.length) continue;
        const bitPos = msbFirst ? (7 - (col & 7)) : (col & 7);
        if ((bytes[byteIdx] >> bitPos) & 1) {
          ctx.fillRect(col * px, baseY, px, px);
        }
      }
    }

    if (showGrid && scale >= 3) {
      ctx.strokeStyle = "rgba(15,23,42,0.09)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 1; x < w; x++) {
        const lx = x * px + 0.5;
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
      }
      for (let y = 1; y < h; y++) {
        const ly = y * px + 0.5;
        ctx.moveTo(0, ly);
        ctx.lineTo(canvas.width, ly);
      }
      ctx.stroke();
    }
  }

  function renderPreview(list) {
    const box = $("preview");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<span style="color:#94a3b8;font-size:13px">暂无预览</span>';
      return;
    }

    const scale = parseInt($("zoom").value, 10) || 8;
    const showGrid = $("chkGrid").checked;
    const msbFirst = $("bitOrder").value === "msb";

    list.forEach(function (it) {
      const wrap = document.createElement("div");
      wrap.className = "item";

      const cv = document.createElement("canvas");
      drawGlyph(cv, it.bytes, it.width, it.height, scale, msbFirst, showGrid);
      wrap.appendChild(cv);

      const ch = document.createElement("div");
      ch.className = "ch";
      ch.textContent = it.ch;
      wrap.appendChild(ch);

      const bpr = Math.ceil(it.width / 8);
      const realRows = Math.ceil(it.bytes.length / bpr);
      const dim = document.createElement("div");
      dim.className = "dim";
      dim.textContent = it.width + "×" + it.height + " · " + it.bytes.length + "字节";
      if (realRows !== it.height) {
        dim.classList.add("warn");
        dim.title = "数据实际为 " + realRows + " 行（每行 " + bpr + " 字节），但按 " + it.height + " 行显示";
        dim.textContent += " ⚠实际" + realRows + "行";
      }
      wrap.appendChild(dim);

      box.appendChild(wrap);
    });
  }

  /* ================= 主流程 ================= */

  function setStatus(text, cls) {
    const el = $("status");
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }

  function convert() {
    const src = $("input").value;
    if (!src.trim()) {
      setStatus("请先粘贴或导入原始字模数据。", "err");
      return;
    }

    const items = parseInput(src);
    if (!items.length) {
      $("output").value = "";
      $("outTag").textContent = "—";
      renderPreview([]);
      setStatus('没有解析到字符数据，请检查每段是否以 /*"字",n*/ 结尾。', "err");
      return;
    }

    const fontName = $("fontName").value.trim() || "微软雅黑";
    const fontSize = $("fontSize").value.trim() || "12";
    const width = Math.max(1, parseInt($("width").value, 10) || 16);
    const heightInput = $("height").value.trim();
    const bytesPerRow = Math.max(1, Math.ceil(width / 8));

    const blocks = [];
    const previewData = [];

    items.forEach(function (it) {
      const autoH = Math.max(1, Math.round(it.bytes.length / bytesPerRow));
      const h = heightInput ? (parseInt(heightInput, 10) || autoH) : autoH;

      blocks.push(buildBlock(it, width, h, fontName, fontSize));
      previewData.push({ ch: it.ch, bytes: it.bytes, width: width, height: h });
    });

    $("output").value = "{\n" + blocks.join(",\n\n") + ",\n}";
    $("outTag").textContent = items.length + " 个字符";
    renderPreview(previewData);

    const first = previewData[0];
    const bpr = Math.ceil(first.width / 8);
    const realRows = Math.ceil(first.bytes.length / bpr);
    let note = "，" + first.width + "x" + first.height + " 点阵";
    if (realRows !== first.height) {
      note += "（注意：数据实际为 " + realRows + " 行）";
    }
    setStatus("转换完成：共 " + items.length + " 个字符" + note + "。", "ok");
  }

  /* ================= 编码检测与解码 ================= */

  // 通过严格 UTF-8 解码测试来判定编码
  function detectEncoding(bytes) {
    // 1) BOM 检测
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return "utf-8";
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return "utf-16le";
    if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return "utf-16be";

    // 2) 先尝试严格 UTF-8：只要出现非法序列就会抛异常
    try {
      new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      return "utf-8";
    } catch (e) {
      // 落到 GBK
    }

    // 3) 默认 GBK（兼容 GB2312），这是国内字库文件最常见的编码
    return "gbk";
  }

  function decodeBuffer(buffer, encoding) {
    const bytes = new Uint8Array(buffer);
    let enc = encoding;
    if (enc === "auto") enc = detectEncoding(bytes);

    try {
      return { text: new TextDecoder(enc, { fatal: false }).decode(bytes), encoding: enc };
    } catch (e) {
      // 浏览器不支持该编码时兜底
      return { text: new TextDecoder("utf-8", { fatal: false }).decode(bytes), encoding: "utf-8(兜底)" };
    }
  }

  /* ================= 事件绑定 ================= */

  $("btnConvert").addEventListener("click", convert);
  $("chkGrid").addEventListener("change", convert);
  $("zoom").addEventListener("change", convert);
  $("bitOrder").addEventListener("change", convert);

  let timer = null;
  function scheduleConvert() {
    clearTimeout(timer);
    timer = setTimeout(convert, 250);
  }
  $("width").addEventListener("input", scheduleConvert);
  $("height").addEventListener("input", scheduleConvert);

  $("btnCopy").addEventListener("click", function () {
    const text = $("output").value;
    if (!text) { setStatus("没有可复制的内容。", "err"); return; }
    const done = () => setStatus("结果已复制到剪贴板。", "ok");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {
        $("output").select(); document.execCommand("copy"); done();
      });
    } else {
      $("output").select(); document.execCommand("copy"); done();
    }
  });

  $("btnSample").addEventListener("click", function () {
    $("input").value = SAMPLE;
    convert();
  });

  $("btnOpen").addEventListener("click", () => $("fileInput").click());

  $("fileInput").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function () {
      // 关键修复：用 ArrayBuffer 读取，再按编码解码
      const result = decodeBuffer(reader.result, $("encoding").value);
      $("input").value = result.text;
      setStatus('已载入文件：' + file.name + '（解码编码：' + result.encoding + '）', "ok");
      convert();
    };
    reader.onerror = () => setStatus("文件读取失败。", "err");
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  });

  $("input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault(); convert();
    }
  });

  // 首次加载示例
  $("input").value = SAMPLE;
  convert();
})();
</script>
</body>
</html>
